<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>LifePulse Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #10233e, #050914 58%); color: #fff; font-family: system-ui, sans-serif; }
    main { width: min(100%, 430px); padding: 28px; border: 1px solid rgba(0,210,255,.45); border-radius: 24px; background: rgba(7,17,31,.94); box-shadow: 0 0 34px rgba(0,210,255,.18); text-align: center; }
    .mark { color: #00d2ff; font-size: 1.8rem; font-weight: 900; letter-spacing: .08em; }
    svg { width: 100%; height: 52px; margin: 14px 0; fill: none; stroke: #00ff88; stroke-width: 3; filter: drop-shadow(0 0 5px rgba(0,255,136,.65)); }
    p { color: #c8d5e8; line-height: 1.55; }
    button { margin-top: 10px; padding: 12px 18px; border: 1px solid #00d2ff; border-radius: 999px; background: rgba(0,210,255,.14); color: #fff; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <div class="mark">LIFEPULSE</div>
    <svg viewBox="0 0 420 60" aria-hidden="true"><path d="M0 30h105l12-8 13 8h28l8 8 12-34 13 54 15-28h42l14-12 18 12h140"/></svg>
    <h1>You’re Offline</h1>
    <p>Your saved LifePulse app shell is available. Reconnect to refresh live sky, history, economic, sports, and forecast data.</p>
    <button type="button" onclick="location.reload()">TRY AGAIN</button>
  </main>
</body>
</html>
