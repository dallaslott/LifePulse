name: Refresh Life Pulse and publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Life Pulse
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh daily data
        env:
          FREE_ASTRO_API_KEY: ${{ secrets.FREE_ASTRO_API_KEY }}
        run: node scripts/update-live-data.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public site
        run: |
          mkdir _site
          cp index.html live-data.json sports-data-v4.json _site/
          touch _site/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


