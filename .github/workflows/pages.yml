name: Refresh Life Pulse and publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Life Pulse
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install astronomy calculations
        run: npm install --no-audit --no-fund

      - name: Refresh sports champions and future schedules when due
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-sports-data.mjs

      - name: Refresh daily data
        env:
          FREE_ASTRO_API_KEY: ${{ secrets.FREE_ASTRO_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/update-live-data.mjs

      - name: Validate refreshed data
        run: node scripts/validate-live-data.mjs

      - name: Commit refreshed sports data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- sports-data-v4.json; then
            echo "No sports data change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sports-data-v4.json
            git commit -m "Refresh sports schedules and champions [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public site
        run: |
          mkdir -p _site/vendor
          cp index.html live-data.json version.json sports-data-v4.json _site/
          cp node_modules/astronomy-engine/astronomy.browser.min.js _site/vendor/
          touch _site/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


