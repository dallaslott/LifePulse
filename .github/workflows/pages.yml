name: Refresh Life Pulse and publish Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Life Pulse
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install astronomy calculations
        run: npm install --no-audit --no-fund

      - name: Refresh sports champions and future schedules when due
        run: node scripts/update-sports-data.mjs

      - name: Refresh annual sky calendar when due
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-sky-events.mjs

      - name: Refresh annual cost-of-living references when due
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: node scripts/update-cost-of-living-data.mjs

      - name: Refresh official place population and local income data when due
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: node scripts/update-place-economic-data.mjs

      - name: Refresh daily data
        env:
          FREE_ASTRO_API_KEY: ${{ secrets.FREE_ASTRO_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/update-live-data.mjs

      - name: Validate refreshed data
        run: |
          node --check time-flight.js
          node --check pulse-run.js
          node --check orbit-relay.js
          node scripts/validate-time-flight.mjs
          node scripts/validate-live-data.mjs

      - name: Commit refreshed maintained datasets
        run: |
          if git diff --quiet -- sports-data-v4.json sky-events.json cost-of-living-data.json place-economic-data.json; then
            echo "No maintained dataset change to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sports-data-v4.json sky-events.json cost-of-living-data.json place-economic-data.json
            git commit -m "Refresh maintained LifePulse datasets [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public site
        run: |
          mkdir -p _site/vendor _site/assets/time-flight
          cp index.html time-flight.js pulse-run.js pulse-run.css orbit-relay.js orbit-relay.css three.min.js manifest.webmanifest sw.js offline.html live-data.json version.json sports-data-v4.json sky-events.json cost-of-living-data.json place-economic-data.json _site/
          cp assets/lifepulse-icon-192.png assets/lifepulse-icon-512.png assets/lifepulse-maskable-512.png assets/nasa-blue-marble-2048.png _site/assets/
          cp assets/time-flight/*.jpg _site/assets/time-flight/
          if [ -f assets/lifepulse-notification.png ]; then
            cp assets/lifepulse-notification.png _site/assets/
          else
            cp assets/lifepulse-icon-192.png _site/assets/lifepulse-notification.png
          fi
          if [ -f assets/simpsons-intro.mp4 ]; then
            cp assets/simpsons-intro.mp4 _site/assets/
          elif [ -f "assets/Simpsons Intro.mp4" ]; then
            cp "assets/Simpsons Intro.mp4" _site/assets/simpsons-intro.mp4
          fi
          cp assets/snl-simpsons-intro.part1 _site/assets/snl-simpsons-intro-1.mp4
          cp assets/snl-simpsons-intro.part2 _site/assets/snl-simpsons-intro-2.mp4
          cp node_modules/astronomy-engine/astronomy.browser.min.js _site/vendor/
          touch _site/.nojekyll

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4




